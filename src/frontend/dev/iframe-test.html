<!DOCTYPE html>
<html class="nr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iframe Test - Unraid Simulation</title>
  <!--
    Parent-page harness for the Docker Folders iframe apps. Run with
    `MOCK_API=1 yarn dev`, then open /dev/iframe-test.html.

      ?frame=index   the Folders app (default)
      ?frame=widget  the dashboard widget
      ?mode=dark     start at night
      ?nofix=1       leave out the iframe's color-scheme:normal, which shows the
                     opaque white canvas behind the frame at night

    It loads the real include/frameSrc.js (served by the mock API plugin) and
    wires it the way Folders.page does, so the frame gets its theme from the URL
    and then from docker-folders-theme messages.

    The theme mechanism copies the Neoraid plugin: a class on <html> picks the
    palette (html.nr-dark or html.nr-light), and `html.nr:root` maps the
    stock Unraid variables onto it. The buttons below flip that class in place,
    with no reload, which is the case that left the frame on day colours.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Palette, as in Neoraid's sheets/Neoraid.css */
    html.nr {
      --nr-bg: #f5f5f4;
      --nr-surface: #ffffff;
      --nr-border: #d6d3d1;
      --nr-text: #1c1917;
      --nr-muted: #57534e;
      color-scheme: light;
    }
    html.nr.nr-dark {
      --nr-bg: #111110;
      --nr-surface: #1a1918;
      --nr-border: #2c2b29;
      --nr-text: #eeedeb;
      --nr-muted: #b4b0ab;
      /* Neoraid sets this at night. The frame inherits it, and a frame whose
         scheme differs from its document's gets an opaque white canvas. */
      color-scheme: dark;
    }
    /* The bridge: stock Unraid variable names pointed at the palette */
    html.nr:root {
      --text-color: var(--nr-text);
      --background-color: var(--nr-bg);
      --border-color: var(--nr-border);
      --header-text-color: #ffffff;
      --button-background: var(--nr-surface);
      --button-text-color: var(--nr-text);
    }

    body {
      font-family: sans-serif;
      font-size: 14px;
      background: var(--background-color);
      color: var(--text-color);
    }

    .fake-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nr-surface);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .fake-nav span { cursor: pointer; }
    .fake-nav span.active { color: #b45309; font-weight: bold; }
    .fake-nav .spacer { flex: 1; }
    .fake-nav button {
      padding: 6px 14px;
      border: 1px solid var(--border-color);
      background: var(--nr-surface);
      color: var(--text-color);
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    .fake-nav button[aria-pressed="true"] { border-color: #b45309; font-weight: bold; }

    .fake-container-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      background: var(--nr-surface);
    }
    .fake-container-row .icon {
      width: 40px; height: 40px;
      background: var(--border-color); border-radius: 6px;
    }
    .fake-container-row .info { flex: 1; }
    .fake-container-row .name { font-weight: bold; font-size: 14px; }
    .fake-container-row .image { font-size: 12px; color: var(--nr-muted); font-family: monospace; }
    .fake-container-row .stats { font-size: 13px; color: var(--nr-muted); }

    .fake-bottom-bar {
      position: sticky;
      bottom: 0;
      z-index: 100;
      background: var(--nr-surface);
      padding: 10px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .fake-bottom-bar button {
      padding: 6px 14px;
      border: 1px solid #b45309;
      background: transparent;
      color: #b45309;
      border-radius: 4px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    html.nr-dark .fake-bottom-bar button,
    html.nr-dark .fake-nav span.active { color: #fb923c; border-color: #fb923c; }

    iframe {
      /* Same as the plugin pages. ?nofix=1 drops it to show the white canvas. */
      color-scheme: normal;
      display: block;
      width: 100%;
      min-height: 600px;
      border: none;
    }

    .section-label {
      padding: 8px 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--nr-muted);
      background: var(--background-color);
    }
  </style>
</head>
<body>
  <div class="fake-nav">
    <span>Dashboard</span>
    <span>Main</span>
    <span>Settings</span>
    <span class="active">Docker</span>
    <span>Apps</span>
    <span class="spacer"></span>
    <button id="mode-light" type="button" aria-pressed="false">Day</button>
    <button id="mode-dark" type="button" aria-pressed="false">Night</button>
  </div>

  <div class="fake-container-row">
    <div class="icon"></div>
    <div class="info">
      <div class="name">plex</div>
      <div class="image">linuxserver/plex:latest</div>
    </div>
    <div class="stats">CPU 2.3% MEM 1.8%</div>
  </div>

  <div class="section-label">Docker Folders Plugin (iframe below)</div>

  <iframe id="docker-folders-frame" scrolling="no"></iframe>

  <div class="section-label">Native Docker Containers</div>
  <div class="fake-container-row">
    <div class="icon"></div>
    <div class="info">
      <div class="name">grafana</div>
      <div class="image">grafana/grafana:latest</div>
    </div>
    <div class="stats">CPU 0.3% MEM 1.2%</div>
  </div>

  <div class="fake-bottom-bar">
    <button type="button">Add Container</button>
    <button type="button">Start All</button>
    <button type="button">Stop All</button>
  </div>

  <script src="/include/frameSrc.js"></script>
  <script>
    var frame = document.getElementById('docker-folders-frame');
    if (new URLSearchParams(location.search).get('nofix')) frame.style.colorScheme = 'inherit';
    var page = new URLSearchParams(location.search).get('frame') === 'widget' ? 'widget.html' : 'index.html';

    // Day or night, in place. Same mechanism as Neoraid: one class on <html>.
    function setMode(mode) {
      document.documentElement.classList.remove('nr-dark', 'nr-light');
      document.documentElement.classList.add('nr-' + mode);
      document.getElementById('mode-light').setAttribute('aria-pressed', String(mode === 'light'));
      document.getElementById('mode-dark').setAttribute('aria-pressed', String(mode === 'dark'));
    }
    document.getElementById('mode-light').addEventListener('click', function() { setMode('light'); });
    document.getElementById('mode-dark').addEventListener('click', function() { setMode('dark'); });
    setMode(new URLSearchParams(location.search).get('mode') === 'dark' ? 'dark' : 'light');

    // Same wiring as Folders.page. The dev server has no csrf_token, so the
    // helper builds /plugins/.../assets/<page>; use the dev paths instead.
    var built = window.dockerFoldersFrameSrc(page);
    frame.src = '/' + page + built.slice(built.indexOf('?'));
    var sendTheme = window.dockerFoldersWatchTheme(function() { return frame; });
    frame.addEventListener('load', function() { sendTheme(true); });

    window.addEventListener('message', function(e) {
      if (e.source !== frame.contentWindow) return;
      if (e.data && e.data.type === 'docker-folders-resize') {
        frame.style.height = e.data.height + 'px';
      }
      if (e.data && e.data.type === 'docker-folders-widget-ready') sendTheme(true);
    });
  </script>
</body>
</html>
